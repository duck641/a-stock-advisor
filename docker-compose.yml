# ═══════════════════════════════════════════
# A_stock Agent — Docker Compose
#
# 启动所有服务：
#   docker compose up -d
#
# 查看日志：
#   docker compose logs -f
#
# 停止：
#   docker compose down
# ═══════════════════════════════════════════

services:

  # ─── Web 前端（浏览器访问 localhost:8000）───
  web:
    build: .
    command: python3 wechat/server.py
    ports:
      # 只发布到宿主机回环地址，局域网设备无法直接访问无登录的 Web UI。
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cron/reports:/app/cron/reports
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      # 容器内需监听所有接口，外部访问范围由上面的 127.0.0.1 端口绑定限制。
      - A_STOCK_WEB_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── 定时日报（每天 09:00 生成板块分析）───
  cron:
    build: .
    command: python3 cron/cron.py
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cron/reports:/app/cron/reports
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
