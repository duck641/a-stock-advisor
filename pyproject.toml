[project]
name = "a-stock-advisor"
version = "0.1.0"
description = "基于 LangGraph 的 A 股智能分析助手 — ReAct 智能体自主调用工具获取行情数据并给出投资建议"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "A_stock Advisor Contributors"},
]
keywords = ["a-stock", "stock-analysis", "langgraph", "react-agent", "llm", "akshare", "quantitative-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
urls = {Repository = "https://github.com/duck641/a-stock-advisor", Issues = "https://github.com/yourname/a-stock-advisor/issues"}

dependencies = [
    "akshare>=1.14.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "jinja2>=3.1.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "schedule>=1.2.0",
    "langchain>=1.3.0",
    "langchain-openai>=1.4.0",
    "langgraph>=1.2.0",
    "tiktoken>=0.7.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "prompt-toolkit>=3.0.53",
]

[project.scripts]
a-stock = "cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
package = true

[tool.setuptools]
# 这些文件是项目根目录中的独立 Python 模块，必须显式列出才能随项目一起安装。
py-modules = [
    "agent",
    "chat",
    "cli",
    "cli_ui",
    "config",
    "prompts",
    "logging_config",
    "setup_wizard",
]

[tool.setuptools.packages.find]
exclude = ["data*", "logs*"]
